<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radio</title>
</head>
<body>
     <form action="/srver">
        <!-- checkbox button -->
    <div>
        choose your subject
        <input type="checkbox" name="subject" id="math" value="math">
        <label for="math">math</label>
        <input type="checkbox" name="subject" id="science" value="science">
        <label for="science">science</label>
        <input type="checkbox" name="subject" id="English" value="English">
        <label for="English">English</label>
        <button>Submit</button>
    
    </div>
    <hr>
    <!-- radio button -->
    <div>
        Choose your fruit :
        <input type="radio" name="fruit" id="apple" value="apple">
        <label for="apple">Apple</label>
         <input type="radio" name="fruit" id="banana" value="banana">
        <label for="banana">Banana</label>
         <input type="radio" name="fruit" id="mango" value="mango">
        <label for="mango">Mango</label>
          <button>Submit</button>
    </div>
    <hr>
    <!-- select tag -->
     <div>
        choose your profession
        <select name="profession" id="profession">
            <option value="Stu">Student</option>
            <option value="Dev">Devoloper</option>
        </select>
     </div>
     <hr>
     <!-- range element -->
      <div>
        <input type="range" id="vol" min="0" max="100" name="vol" step="10" value="70">
        <label for="vol">Volume</label>
        <button>Submit</button>
      </div>
      <hr>
      <!-- textarea -->
       <div>
        <label for="feedback">Please give your feed back</label>
        <textarea id="feedback" placeholder="feedback please" rows="10" cols="100" value="feedback"></textarea>
        <button>Submit</button>
    </div>
    </form>
</body>
</html>
