<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <form>
        <label>
            username
            <input type="text" placeholder="Enter Name">
            <br>
        </label>
        colour
        <input type="color">
        <br>
        <label>
            password
            <input type="password" placeholder="Enter Password">
            <br>
        </label>
        time
        <input type="time">
        <br>
        number
        <input type="number">
        <br>
        date
        <input type="date">
        <br>
        checkbox
        <input type="checkbox">
        <br>
        range
        <input type="range">
    </form>
</body>

</html>
