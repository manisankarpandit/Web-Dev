<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div tag</title>
</head>
<body>
    <h1>without using div tag</h1>
     <a href="www.youtube.com">Yoytube</a>
      <a href="www.facebook.com">Facebook</a>
    <a href="www.linkdin.com">LInkdin</a>
    <h1>using div tag</h1>
    <div>
      <a href="www.facebook.com">Facebook</a>
    </div>
    <div>
        <a href="www.youtube.com">Yoytube</a>
    </div>
    <a href="www.linkdin.com">LInkdin</a>
</body>
</html>
